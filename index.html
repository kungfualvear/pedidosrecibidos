<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Recetas/Pedidos Recibidos</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
    background:#f3f4f6;
    color:#111827;
    padding:20px;
}

.app{
    max-width:520px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:22px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h1{
    font-size:27px;
    margin-bottom:22px;
    text-align:center;
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

.menuButton{

    width:100%;
    height:64px;

    border:none;
    border-radius:12px;

    background:#111827;
    color:white;

    font-size:18px;
    font-weight:700;

    cursor:pointer;

    margin-bottom:18px;
}

.back{

    background:none;
    border:none;

    color:#111827;

    font-size:15px;
    cursor:pointer;

    margin-bottom:20px;
}

.campo{

    margin-bottom:18px;

}

label{

    display:block;

    margin-bottom:7px;

    font-weight:600;

}

input,
select{

    width:100%;
    height:54px;

    border:2px solid #E5E7EB;

    border-radius:11px;

    padding:0 14px;

    font-size:17px;

}

input:focus,
select:focus{

    outline:none;
    border-color:#111827;

}

.submit{

    width:100%;
    height:58px;

    background:#111827;

    color:#fff;

    border:none;

    border-radius:12px;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

}

.resultado{

    margin-top:18px;

    display:none;

    padding:14px;

    border-radius:10px;

    text-align:center;

}

.exito{

    display:block;

    background:#ECFDF5;

    color:#065F46;

}

.error{

    display:block;

    background:#FEF2F2;

    color:#991B1B;

}

</style>

</head>

<body>

<div class="app">

<!--========================================================-->
<!-- PANTALLA INICIO -->
<!--========================================================-->

<section
id="inicio"
class="screen active">

<div class="card">

<h1>

Recetas/Pedidos Recibidos

</h1>

<button
id="abrirCarga"
class="menuButton">

Cargar registros

</button>

<button
id="abrirConsulta"
class="menuButton">

Consultar registros

</button>

</div>

</section>

<!--========================================================-->
<!-- PANTALLA CARGAR -->
<!--========================================================-->

<section
id="pantallaCarga"
class="screen">

<div class="card">

<button
class="back"
id="volverInicio1">

← Inicio

</button>

<h1>

Recetas/Pedidos Recibidos

</h1>

<form id="formulario">

<div class="campo">

<label>Médico</label>

<select id="medico">

<option selected>

Dr. Bustos

</option>

<option>

Dr. Zalazar

</option>

</select>

</div>

<div class="campo">

<label>

Paciente

</label>

<input
id="paciente"
autocomplete="off"
required>

</div>

<div class="campo">

<label>

Solicita

</label>

<select
id="solicita"
required>

<option value="">

Seleccionar...

</option>

<option>

Receta

</option>

<option>

Pedido

</option>

<option>

Receta y Pedido

</option>

<option>

Empadronamiento

</option>

<option>

Receta y Empadronamiento

</option>

<option>

Otro

</option>

</select>

</div>

<button
class="submit"
id="boton">

Registrar

</button>

<div
id="resultado"
class="resultado">

</div>

</form>

</div>

</section>

<!--========================================================-->
<!-- PANTALLA CONSULTAR (SE IMPLEMENTARÁ EN PARTE 2) -->
<!--========================================================-->

<section
id="pantallaConsulta"
class="screen">

<div class="card">

<button
class="back"
id="volverInicio2">

← Inicio

</button>

<h1>

Consultar registros

</h1>

</div>

</section>

</div>

<script>

const URL_APPS_SCRIPT="https://script.google.com/macros/s/AKfycbx46ZfE083mZ7Pv9C53z-KnleGVEmca1dzR56uhhT6g4aE2wSzeIi5MPXXVLqGnAcmxrA/exec";

const screens=document.querySelectorAll(".screen");

function abrir(id){

    screens.forEach(s=>s.classList.remove("active"));

    document
    .getElementById(id)
    .classList
    .add("active");

}

abrirCarga.onclick=()=>{

    abrir("pantallaCarga");

    setTimeout(()=>paciente.focus(),150);

}

abrirConsulta.onclick=()=>{

    abrir("pantallaConsulta");

}

volverInicio1.onclick=()=>{

    abrir("inicio");

}

volverInicio2.onclick=()=>{

    abrir("inicio");

}

const CLAVE_MEDICO="medicoSeleccionado";

medico.value=

localStorage.getItem(CLAVE_MEDICO)

||

"Dr. Bustos";

medico.onchange=()=>{

localStorage.setItem(

CLAVE_MEDICO,

medico.value

);

};

paciente.addEventListener(

"input",

function(){

this.value=this.value.toUpperCase();

}

);

function obtenerFecha(){

const d=new Date();

return d.getFullYear()+"-"+

String(d.getMonth()+1).padStart(2,"0")+"-"+

String(d.getDate()).padStart(2,"0");

}

function mostrarResultado(tipo,texto){

resultado.className="resultado "+tipo;

resultado.innerHTML=texto;

}

formulario.addEventListener(

"submit",

async function(e){

e.preventDefault();

const datos=new URLSearchParams();

datos.append(

"fecha",

obtenerFecha()

);

datos.append(

"medico",

medico.value

);

datos.append(

"paciente",

paciente.value.trim().toUpperCase()

);

datos.append(

"solicita",

solicita.value

);

try{

boton.disabled=true;

boton.textContent="Registrando...";

const r=await fetch(

URL_APPS_SCRIPT,

{

method:"POST",

body:datos

}

);

const j=await r.json();

if(!j.ok){

throw Error();

}

mostrarResultado(

"exito",

"Registro realizado"

);

paciente.value="";

solicita.selectedIndex=0;

setTimeout(()=>{

paciente.focus();

},100);

}catch{

mostrarResultado(

"error",

"No se pudo registrar."

);

}

boton.disabled=false;

boton.textContent="Registrar";

}

);

</script>

</body>
</html>
