<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Recetas/Pedidos Recibidos</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}


body{
    background:#f3f4f6;
    color:#111827;
    padding:20px;
}


.app{
    max-width:520px;
    margin:auto;
}


.card{
    background:#fff;
    border-radius:18px;
    padding:22px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}


h1{
    font-size:27px;
    margin-bottom:22px;
    text-align:center;
}


.screen{
    display:none;
}


.screen.active{
    display:block;
}


.menuButton{

    width:100%;
    height:64px;

    border:none;
    border-radius:12px;

    background:#111827;
    color:white;

    font-size:18px;
    font-weight:700;

    cursor:pointer;

    margin-bottom:18px;

}


.back{

    background:none;
    border:none;

    color:#111827;

    font-size:15px;
    cursor:pointer;

    margin-bottom:20px;

}


.campo{
    margin-bottom:18px;
}


label{

    display:block;

    margin-bottom:7px;

    font-weight:600;

}


input,
select{

    width:100%;
    height:54px;

    border:2px solid #E5E7EB;

    border-radius:11px;

    padding:0 14px;

    font-size:17px;

}


input:focus,
select:focus{

    outline:none;
    border-color:#111827;

}


.submit{

    width:100%;
    height:58px;

    background:#111827;

    color:#fff;

    border:none;

    border-radius:12px;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

}


.submit:disabled{

    opacity:.6;
    cursor:not-allowed;

}


.resultado{

    margin-top:18px;

    display:none;

    padding:14px;

    border-radius:10px;

    text-align:center;

}


.exito{

    display:block;

    background:#ECFDF5;

    color:#065F46;

}


.error{

    display:block;

    background:#FEF2F2;

    color:#991B1B;

}


/* =====================================================
   RESULTADOS DE CONSULTA
   ===================================================== */


.registro{

    border:1px solid #E5E7EB;

    border-radius:12px;

    padding:14px;

    margin-bottom:12px;

    background:#F9FAFB;

}


.registro strong{

    color:#111827;

}


.registroLinea{

    margin-top:5px;

    font-size:14px;

    color:#4B5563;

}


.sinResultados{

    padding:18px;

    text-align:center;

    color:#6B7280;

    background:#F9FAFB;

    border-radius:12px;

}


/* =====================================================
   SEPARADOR
   ===================================================== */


.separador{

    height:1px;

    background:#E5E7EB;

    margin:20px 0;

}


/* =====================================================
   CONTADOR DE RESULTADOS
   ===================================================== */


.contador{

    font-size:14px;

    font-weight:600;

    margin-bottom:12px;

    color:#374151;

    text-align:center;

}


/* =====================================================
   BOTÓN LIMPIAR
   ===================================================== */


.botonSecundario{

    width:100%;

    height:50px;

    background:#fff;

    color:#111827;

    border:2px solid #E5E7EB;

    border-radius:11px;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    margin-top:10px;

}


.botonSecundario:hover{

    background:#F9FAFB;

}

</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     PANTALLA INICIO
     ===================================================== -->


<section
id="inicio"
class="screen active">


<div class="card">


<h1>

Recetas/Pedidos Recibidos

</h1>


<button
id="abrirCarga"
class="menuButton">

Cargar registros

</button>


<button
id="abrirConsulta"
class="menuButton">

Consultar registros

</button>


</div>

</section>



<!-- =====================================================
     PANTALLA CARGA
     ===================================================== -->


<section
id="pantallaCarga"
class="screen">


<div class="card">


<button
class="back"
id="volverInicio1">

← Inicio

</button>


<h1>

Recetas/Pedidos Recibidos

</h1>


<form id="formulario">


<!-- MÉDICO -->


<div class="campo">


<label>

Médico

</label>


<select
id="medico"
required>


<option selected>

Dr. Bustos

</option>


<option>

Dr. Zalazar

</option>


</select>


</div>



<!-- PACIENTE -->


<div class="campo">


<label>

Paciente

</label>


<input
id="paciente"
autocomplete="off"
required>


</div>



<!-- SOLICITA -->


<div class="campo">


<label>

Solicita

</label>


<select
id="solicita"
required>


<option selected>

Receta

</option>


<option>

Pedido

</option>


<option>

Receta y Pedido

</option>

<option>

Receta y Laboratorio

</option>

<option>

Pañales

</option>

<option>

Receta y Pañales

</option>
    
<option>

Empadronamiento

</option>


<option>

Receta y Empadronamiento

</option>

<option>

Laboratorio

</option>
    
<option>

Otro

</option>


</select>


</div>



<button
class="submit"
id="boton"
type="submit">

Registrar

</button>


<div
id="resultado"
class="resultado">

</div>


</form>


</div>


</section>



<!-- =====================================================
     PANTALLA CONSULTA
     ===================================================== -->


<section
id="pantallaConsulta"
class="screen">


<div class="card">


<button
class="back"
id="volverInicio2">

← Inicio

</button>


<h1>

Consultar registros

</h1>



<!-- BÚSQUEDA GENERAL -->


<div class="campo">


<label>

Buscar

</label>


<input
id="busqueda"
type="search"
placeholder="Paciente, ID, médico..."
autocomplete="off">


</div>



<!-- FILTRO MÉDICO -->


<div class="campo">


<label>

Médico

</label>


<select
id="filtroMedico">


<option value="">

Todos

</option>


<option>

Dr. Bustos

</option>


<option>

Dr. Zalazar

</option>


</select>


</div>



<!-- FILTRO SOLICITA -->


<div class="campo">


<label>

Solicita

</label>


<select
id="filtroSolicita">


<option value="">

Todos

</option>


<option>

Receta

</option>


<option>

Pedido

</option>


<option>

Receta y Pedido

</option>


<option>

Empadronamiento

</option>


<option>

Receta y Empadronamiento

</option>


<option>

Otro

</option>


</select>


</div>



<!-- FILTRO FECHA -->


<div class="campo">


<label>

Fecha

</label>


<input
id="filtroFecha"
type="date">


</div>



<!-- BOTÓN BUSCAR -->


<button
class="submit"
id="botonBuscar"
type="button">

Buscar

</button>



<!-- BOTÓN LIMPIAR -->


<button
class="botonSecundario"
id="botonLimpiar"
type="button">

Limpiar filtros

</button>



<div
id="estadoBusqueda"
class="resultado">

</div>



<div
id="resultadosBusqueda"
style="margin-top:18px;">

</div>


</div>


</section>


</div>



<script>


// ========================================================
// CONFIGURACIÓN
// ========================================================


const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycby7t8lwOICXhgAD22sLtZWvSgtFKqWjd0B4Mq7U83mJuCxHMmGRdlMXwo9lEomAeIzkVg/exec";



// ========================================================
// REFERENCIAS
// ========================================================


const screens =
document.querySelectorAll(".screen");


const inicio =
document.getElementById("inicio");


const pantallaCarga =
document.getElementById("pantallaCarga");


const pantallaConsulta =
document.getElementById("pantallaConsulta");


const abrirCarga =
document.getElementById("abrirCarga");


const abrirConsulta =
document.getElementById("abrirConsulta");


const volverInicio1 =
document.getElementById("volverInicio1");


const volverInicio2 =
document.getElementById("volverInicio2");


const formulario =
document.getElementById("formulario");


const medico =
document.getElementById("medico");


const paciente =
document.getElementById("paciente");


const solicita =
document.getElementById("solicita");


const boton =
document.getElementById("boton");


const resultado =
document.getElementById("resultado");



// ========================================================
// FUNCIÓN CAMBIO DE PANTALLA
// ========================================================


function abrir(id){

    screens.forEach(
        s => s.classList.remove("active")
    );


    document
        .getElementById(id)
        .classList.add("active");

}



// ========================================================
// NAVEGACIÓN
// ========================================================


abrirCarga.onclick = () => {

    abrir("pantallaCarga");


    setTimeout(
        () => paciente.focus(),
        150
    );

};


abrirConsulta.onclick = () => {

    abrir("pantallaConsulta");

};


volverInicio1.onclick = () => {

    abrir("inicio");

};


volverInicio2.onclick = () => {

    abrir("inicio");

};



// ========================================================
// MÉDICO SELECCIONADO
// ========================================================


const CLAVE_MEDICO =
"medicoSeleccionado";


medico.value =
localStorage.getItem(
    CLAVE_MEDICO
)
||
"Dr. Bustos";


medico.onchange = () => {

    localStorage.setItem(
        CLAVE_MEDICO,
        medico.value
    );

};



// ========================================================
// CONVERTIR PACIENTE A MAYÚSCULAS
// ========================================================


paciente.addEventListener(
    "input",
    function(){

        this.value =
            this.value.toUpperCase();

    }
);



// ========================================================
// OBTENER FECHA LOCAL
// ========================================================


function obtenerFecha(){

    const d =
        new Date();


    return d.getFullYear() +
        "-" +
        String(
            d.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            d.getDate()
        ).padStart(2,"0");

}



// ========================================================
// MOSTRAR RESULTADO DE REGISTRO
// ========================================================


function mostrarResultado(
    tipo,
    texto
){

    resultado.className =
        "resultado " +
        tipo;


    resultado.innerHTML =
        texto;

}



// ========================================================
// REGISTRAR
// ========================================================


formulario.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const datos =
            new URLSearchParams();


        datos.append(
            "fecha",
            obtenerFecha()
        );


        datos.append(
            "medico",
            medico.value
        );


        datos.append(
            "paciente",
            paciente.value
                .trim()
                .toUpperCase()
        );


        datos.append(
            "solicita",
            solicita.value
        );


        try{

            boton.disabled =
                true;


            boton.textContent =
                "Registrando...";


            const r =
                await fetch(
                    URL_APPS_SCRIPT,
                    {
                        method:"POST",
                        body:datos
                    }
                );


            const j =
                await r.json();


            if(!j.ok){

                throw new Error(
                    j.mensaje ||
                    "Error"
                );

            }


            mostrarResultado(
                "exito",
                "Registro realizado<br>" +
                "<strong>" +
                j.id +
                "</strong>"
            );


            paciente.value =
                "";


            solicita.selectedIndex =
                0;


            setTimeout(
                () => {

                    paciente.focus();

                },
                100
            );


        }catch(error){

            console.error(error);


            mostrarResultado(
                "error",
                "No se pudo registrar."
            );

        }


        boton.disabled =
            false;


        boton.textContent =
            "Registrar";

    }
);



// ========================================================
// ELEMENTOS DE BÚSQUEDA
// ========================================================


const busqueda =
document.getElementById(
    "busqueda"
);


const filtroMedico =
document.getElementById(
    "filtroMedico"
);


const filtroSolicita =
document.getElementById(
    "filtroSolicita"
);


const filtroFecha =
document.getElementById(
    "filtroFecha"
);


const botonBuscar =
document.getElementById(
    "botonBuscar"
);


const botonLimpiar =
document.getElementById(
    "botonLimpiar"
);


const resultadosBusqueda =
document.getElementById(
    "resultadosBusqueda"
);


const estadoBusqueda =
document.getElementById(
    "estadoBusqueda"
);



// ========================================================
// ESCAPAR HTML
// Evita interpretar contenido de la planilla como HTML
// ========================================================


function escaparHTML(valor){

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



// ========================================================
// MOSTRAR RESULTADOS
// ========================================================


function mostrarResultados(
    registros
){


    if(
        !registros ||
        registros.length === 0
    ){

        resultadosBusqueda.innerHTML =
            '<div class="sinResultados">' +
            'No se encontraron registros.' +
            '</div>';

        return;

    }



    resultadosBusqueda.innerHTML =

        '<div class="contador">' +

        registros.length +

        (
            registros.length === 1
            ? " registro encontrado"
            : " registros encontrados"
        ) +

        '</div>' +


        registros
            .map(
                r => `

                <div class="registro">

                    <div>

                        <strong>
                            ${escaparHTML(r.id)}
                        </strong>

                    </div>


                    <div class="registroLinea">

                        <strong>
                            Fecha:
                        </strong>

                        ${escaparHTML(r.fecha)}

                    </div>


                    <div class="registroLinea">

                        <strong>
                            Hora:
                        </strong>

                        ${escaparHTML(r.hora)}

                    </div>


                    <div class="registroLinea">

                        <strong>
                            Paciente:
                        </strong>

                        ${escaparHTML(r.paciente)}

                    </div>


                    <div class="registroLinea">

                        <strong>
                            Médico:
                        </strong>

                        ${escaparHTML(r.medico)}

                    </div>


                    <div class="registroLinea">

                        <strong>
                            Solicita:
                        </strong>

                        ${escaparHTML(r.solicita)}

                    </div>

                </div>

                `
            )
            .join("");

}



// ========================================================
// BUSCAR REGISTROS
// ========================================================


async function buscarRegistros(){


    const parametros =
        new URLSearchParams();


    parametros.append(
        "accion",
        "buscar"
    );


    parametros.append(
        "q",
        busqueda.value.trim()
    );


    parametros.append(
        "medico",
        filtroMedico.value
    );


    parametros.append(
        "solicita",
        filtroSolicita.value
    );


    parametros.append(
        "fecha",
        filtroFecha.value
    );



    try{


        botonBuscar.disabled =
            true;


        botonBuscar.textContent =
            "Buscando...";


        estadoBusqueda.className =
            "resultado exito";


        estadoBusqueda.textContent =
            "Buscando registros...";


        resultadosBusqueda.innerHTML =
            "";



        const respuesta =
            await fetch(

                URL_APPS_SCRIPT +
                "?" +
                parametros.toString()

            );



        if(!respuesta.ok){

            throw new Error(
                "HTTP " +
                respuesta.status
            );

        }



        const datos =
            await respuesta.json();



        if(!datos.ok){

            throw new Error(
                datos.mensaje ||
                "Error de consulta"
            );

        }



        const registros =
            datos.registros || [];



        mostrarResultados(
            registros
        );



        estadoBusqueda.className =
            "resultado exito";


        estadoBusqueda.textContent =

            registros.length === 0

            ? "No se encontraron registros."

            :

            (
                registros.length === 1

                ? "1 registro encontrado."

                :

                registros.length +
                " registros encontrados."
            );



    }catch(error){


        console.error(
            "Error de búsqueda:",
            error
        );


        estadoBusqueda.className =
            "resultado error";


        estadoBusqueda.textContent =
            "No se pudo realizar la búsqueda.";


        resultadosBusqueda.innerHTML =
            "";



    }finally{


        botonBuscar.disabled =
            false;


        botonBuscar.textContent =
            "Buscar";

    }

}



// ========================================================
// BOTÓN BUSCAR
// ========================================================


botonBuscar.addEventListener(
    "click",
    buscarRegistros
);



// ========================================================
// ENTER EN CAMPO DE BÚSQUEDA
// ========================================================


busqueda.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Enter"
        ){

            e.preventDefault();

            buscarRegistros();

        }

    }
);



// ========================================================
// CAMBIO AUTOMÁTICO DE FILTROS
// ========================================================


[
    filtroMedico,
    filtroSolicita,
    filtroFecha

].forEach(

    elemento => {

        elemento.addEventListener(
            "change",
            buscarRegistros
        );

    }

);



// ========================================================
// LIMPIAR FILTROS
// ========================================================


botonLimpiar.addEventListener(
    "click",
    function(){

        busqueda.value =
            "";

        filtroMedico.value =
            "";

        filtroSolicita.value =
            "";

        filtroFecha.value =
            "";


        estadoBusqueda.className =
            "resultado";


        estadoBusqueda.textContent =
            "";


        resultadosBusqueda.innerHTML =
            "";

    }
);

</script>

</body>

</html>
